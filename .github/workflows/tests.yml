name: Tests

# Быстрый гейт: только тесты без PostgreSQL. Долгие PG-прогоны (16 матричных
# джоб, десятки минут) живут в pg-tests.yml — по расписанию и вручную.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Sync dependencies (locked)
        run: uv sync --frozen --group dev

      - name: Run test suite (no PostgreSQL)
        run: uv run --frozen pytest -m 'not postgres' -q
