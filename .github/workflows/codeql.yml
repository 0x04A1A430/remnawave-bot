name: CodeQL

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # Еженедельный полный проход, чтобы ловить новые правила даже без коммитов.
    - cron: "31 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          # security-extended: только security-запросы. quality-набор на таком
          # объёме кода даёт сотни note-алертов (empty-except, cyclic-import),
          # которые в PR-гейте выглядят как «новые» и топят реальные находки.
          # Качество по-прежнему проверяют ruff и тесты в Lint/Tests.
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
